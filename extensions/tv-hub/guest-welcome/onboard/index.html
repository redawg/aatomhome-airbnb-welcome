<!DOCTYPE html>
<html lang="en" class="onboard-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, viewport-fit=cover">
  <title>Connect — Guest Welcome</title>
  <script src="/guest/js/tv-display.js?v=20260914d"></script>
  <link rel="stylesheet" href="/guest/css/guest.css?v=20260914d">
  <link rel="stylesheet" href="/guest/onboard/onboard.css?v=20260914d">
  <script src="/guest/js/claim-store.js?v=20260914k"></script>
  <script src="/guest/js/tv-agent-poll.js?v=20260914g"></script>
</head>
<body class="onboard-body">
  <div class="onboard-scene" id="onboardScene">
    <div class="onboard-bg" aria-hidden="true"></div>
    <div class="onboard-overlay" aria-hidden="true"></div>

    <div class="onboard-layout">
      <header class="onboard-header">
        <div class="onboard-brand" aria-hidden="true">
          <svg class="onboard-brand-icon" width="56" height="56" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="4" y="10" width="40" height="26" rx="3" stroke="currentColor" stroke-width="2"/>
            <path d="M16 40h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="24" cy="23" r="6" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <p class="onboard-eyebrow">Guest Welcome</p>
        <h1 class="onboard-title" id="onboardTitle">Connect this TV</h1>
        <p class="onboard-lead" id="onboardLead">
          Type the <strong>6-letter code</strong> shown in the hub under Setup → Rooms &amp; TVs
        </p>
      </header>

      <main class="onboard-card">
        <div class="onboard-field onboard-field--code">
          <label class="onboard-label" for="roomCode">Room code</label>
          <input
            type="text"
            id="roomCode"
            class="onboard-input onboard-input--code focusable"
            maxlength="12"
            autocomplete="off"
            inputmode="text"
            placeholder="······"
            aria-describedby="codeHint"
            spellcheck="false"
            tabindex="0"
          />
        </div>

        <div class="onboard-actions">
          <button type="button" class="onboard-btn onboard-btn--primary focusable" id="btnConnect" tabindex="0">
            Connect to room
          </button>
        </div>

        <p class="onboard-status" id="status" role="status" aria-live="polite"></p>
      </main>

      <footer class="onboard-footer">
        <button type="button" class="onboard-link focusable" id="btnNewCode" tabindex="0">Use a different code</button>
        <span class="onboard-footer-sep" aria-hidden="true">·</span>
        <button type="button" class="onboard-link focusable" id="btnToggleHub" tabindex="0">Hub settings</button>
      </footer>

      <section class="onboard-advanced" id="hubAdvanced" hidden>
        <div class="onboard-field onboard-field--url">
          <label class="onboard-label" for="hubUrl">Hub address</label>
          <input
            type="text"
            id="hubUrl"
            class="onboard-input onboard-input--url focusable"
            autocomplete="off"
            inputmode="url"
            placeholder="http://172.16.1.36:18080"
            tabindex="0"
          />
        </div>
        <button type="button" class="onboard-link focusable" id="btnChangeHub" tabindex="0">Reset hub to default</button>
      </section>
    </div>
  </div>
  <script src="/guest/onboard/onboard.js?v=20260914k"></script>
</body>
</html>
